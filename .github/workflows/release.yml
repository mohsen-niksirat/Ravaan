name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install pyinstaller

      - name: Run test suite
        run: |
          pytest

      - name: Build portable executable
        run: |
          pyinstaller --clean -y ravan.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Setup Installer
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$ver" installer/setup.iss

      - name: Generate Checksums
        run: |
          python scripts/generate_hashes.py | Out-File -FilePath checksums.txt -Encoding utf8
          Get-Content checksums.txt

      - name: Publish GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Ravaan.exe
            dist/Ravaan-Setup-*.exe
            checksums.txt
          name: Ravaan ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          append_body: true
