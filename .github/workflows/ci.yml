name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev] pyyaml

      - name: Lint with ruff
        run: ruff check .

      - name: Run Windows test suite
        if: runner.os == 'Windows'
        run: pytest

      - name: Run cross-platform core tests
        if: runner.os != 'Windows'
        run: |
          pytest tests/test_calc.py tests/test_config.py tests/test_dict.py tests/test_jalali.py tests/test_journal.py tests/test_layout.py tests/test_normalizer.py tests/test_num2words.py tests/test_predictor.py tests/test_snippet.py tests/test_transform.py tests/test_user_dict.py tests/test_cliphistory.py
