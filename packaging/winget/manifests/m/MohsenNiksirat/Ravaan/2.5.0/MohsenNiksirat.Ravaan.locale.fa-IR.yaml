ShortDescription: دستیار هوشمند و امن تایپ دوزبانه فارسی و انگلیسی برای ویندوز بدون ارسال داده.
Description: |-
  روان (Ravaan) دستیار هوشمند تایپ فارسی و انگلیسی در ویندوز است که به صورت کاملاً آفلاین
  و بدون کوچک‌ترین ارسال داده (Zero Telemetry) کار می‌کند.
  امکانات نسخه ۲.۰ شامل: پیشنهاد و تکمیل خودکار هوشمند واژگان، تصحیح خودکار اشتباهات تایپی،
  اصلاح خودکار چیدمان اشتباه کیبورد، تایپ روان نیم‌فاصله و ویرایش نگارشی،
  تبدیل فینگلیش به فارسی، اسنیپت‌های فرم و تصویر (Snippets 3.0)، پکیج‌های اشتراک‌گذاری،
  انتخابگر تنوع حروف (Quick Accent)، دستیار متنی هوش مصنوعی و تایپ صوتی آفلاین.
