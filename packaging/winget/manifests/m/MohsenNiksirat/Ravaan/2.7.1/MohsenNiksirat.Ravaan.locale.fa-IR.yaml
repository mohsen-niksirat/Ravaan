ShortDescription: دستیار هوشمند و امن تایپ دوزبانه فارسی و انگلیسی برای ویندوز بدون ارسال داده.
Description: |-
  روان (Ravaan) دستیار هوشمند تایپ فارسی و انگلیسی در ویندوز است که به صورت کاملاً آفلاین
  و بدون کوچک‌ترین ارسال داده (Zero Telemetry) کار می‌کند.
  امکانات نسخه ۲.۷ شامل: جعبه پیشنهاد با متریال شیشه‌ای (Acrylic) به سبک مک‌اواس،
  جای‌گذاری قابل‌تنظیم نشانگر زبان، ماندگاری بیشتر جعبه پیشنهاد، رفع کندی تایپ،
  پیش‌نمایش زنده استایل‌ها در تنظیمات، پیشنهاد و تکمیل هوشمند واژگان، اصلاح خودکار
  چیدمان و تایپوگرافی، فینگلیش، اسنیپت‌های 3.0، انتخابگر حروف، دستیار هوش مصنوعی
  و تایپ صوتی آفلاین.
