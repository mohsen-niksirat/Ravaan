ShortDescription: Intelligent Persian and bilingual typing assistant for Windows with zero telemetry.
Description: |-
  Ravaan (روان) is an intelligent, privacy-first Persian/English typing assistant for Windows.
  It provides zero-telemetry local text prediction, typo correction, wrong-layout auto-fix,
  Persian typography & ZWNJ normalization, text expansion snippets, Finglish phonetic typing,
  Quick Accent character picker, AI text assistant, and offline voice dictation.
