[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ravan"
version = "0.4.0"
description = "Ravan (روان) — Windows typing assistant for bilingual Persian/English typists"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ravan Contributors" }]
dependencies = [
    "comtypes>=1.2.0",
    "Pillow>=10.0.0",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ravan = "ravan.__main__:main"
ravan-cli = "ravan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ravan*"]

[tool.setuptools.package-data]
ravan = ["data/*.txt", "data/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
