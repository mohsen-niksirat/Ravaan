[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ravan"
version = "2.0.0"

description = "Ravan (روان) — Windows typing assistant for bilingual Persian/English typists"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ravan Contributors" }]
dependencies = [
    "comtypes>=1.2.0; sys_platform == 'win32'",
    "Pillow>=10.0.0",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4.0",
]

[project.scripts]
ravan = "ravan.__main__:main"
ravan-cli = "ravan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ravan*"]

[tool.setuptools.package-data]
ravan = ["data/*.txt", "data/*.bin", "data/*.ico", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line length (handled by formatter or tolerable)
    "B008",  # do not perform function calls in argument defaults
]
